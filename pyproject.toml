[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-ai"
version = "0.1.0"
description = "A local-first, policy-bounded computer-use agent runtime."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0,<3.0", "playwright>=1.48,<2.0"]

[project.scripts]
autopilot = "autopilot_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["autopilot_ai*"]
