[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-ai"
version = "0.1.0"
description = "A local-first, policy-bounded computer-use agent runtime."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0,<3.0", "playwright>=1.48,<2.0", "pywinauto>=0.6.8,<1.0", "pyautogui>=0.9.54,<1.0", "pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
autopilot = "autopilot_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: exercises real filesystem or browser integrations rather than mocked observations",
    "ollama_integration: opt-in test using the configured local Ollama model and server",
    "windows_integration: opt-in test that reads the live Windows foreground window",
]

[tool.setuptools.packages.find]
include = ["autopilot_ai*"]
